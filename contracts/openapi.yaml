    "/api/v1/rooms/group": {
      "post": {
        "operationId": "createGroupRoom",
        "summary": "create Group Room",
        "description": "The creator is added by server; reuse clientRequestId on ambiguous retry.",
        "security": [
          {
            "session": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string",
                    "minLength": 1,
                    "pattern": "[^\\u0009-\\u000D\\u0020\\u0085\\u00A0\\u1680\\u2000-\\u200A\\u2028\\u2029\\u202F\\u205F\\u3000\\uFEFF]",
                    "description": "Trimmed once before validation; the normalized title is at most 80 Unicode scalar values. Whitespace is U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000–U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and U+FEFF."
                  },
                  "memberUserIds": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "enum": [
                        "1",
                        "2",
                        "3"
                      ]
                    },
                    "minItems": 1,
                    "maxItems": 2,
                    "uniqueItems": true
                  },
                  "clientRequestId": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "required": [
                  "title",
                  "memberUserIds",
                  "clientRequestId"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
